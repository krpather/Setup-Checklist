<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Church Setup</title><link rel='stylesheet' href='style.css'></head><body><main><header><p class='eyebrow'>WEEKLY OPERATIONS</p><h1>Church Setup</h1><p>Complete your assigned role checks. The team starts and finishes together.</p></header><section class='card' id='identity'><label>Name<select id='name' required><option value=''>Select your name</option><option>Brian</option><option>Lesego</option><option>Witness</option><option>Kyle</option></select></label><label>Email <span>(optional)</span><input id='email' type='email' placeholder='Skip if not needed'></label><label>Setup date<input id='date' type='date'></label><fieldset><legend>Role(s) this week</legend><div id='roles' class='roles'></div></fieldset></section><section id='checklists'></section><section class='card'><label>Issues / notes<textarea id='notes' rows='4' placeholder='Anything Keanan needs to know?'></textarea></label><div class='progress'><span id='progressText'>0 / 0 complete</span><progress id='progress' value='0' max='1'></progress></div><button id='submit' type='button'>Submit setup</button><p id='status'></p></section></main><script src='app.js'></script></body></html>
